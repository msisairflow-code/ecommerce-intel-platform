name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python files
        run: flake8 . --count --exit-zero --max-line-length=100

      - name: Install project dependencies
        run: pip install -r data_generator/requirements.txt pytest

      - name: Run tests
        run: cd data_generator && python -m pytest